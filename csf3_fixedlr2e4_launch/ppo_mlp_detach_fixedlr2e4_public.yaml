algo: ppo

algo_config:
  ent_coef: 0.00
  norm_obj: adv
  optimizer: adam
  weight_decay: 0.0
  lr_pi: 0.0002
  lr_v: 0.0002
  is_karzmarz: False
  use_kl_adaptive_lr: False
  pi_epochs: 4
  pi_minibatches: 8
  v_epochs: 4
  v_minibatches: 8
  with_popart: True
  adv_type: gae
  cliprange: 0.2
  sigma_type: vector
  cg_damping: 0.1
  grad: pg
  post_grad: fisher_clip
  max_grad_norm: 0.5

env_config:
  env_name: hopper
  num_envs: 32
  nsteps: 256
  timesteps_per_proc: 10_000_000
  norm_ret: False

nets_config:
  norm_obs: True
  type: mlp
  a_dropout: 0.0
  a_hidden_size: 256
  a_num_layers: 2
  c_hidden_size: 256
  c_num_layers: 2
  c_dropout: 0.0

log_config:
  log_interval: 10
  n_eval_trials: 20
