algo: rat

algo_config:
  ent_coef: 0.00
  norm_obj: adv
  optimizer: sgd
  lr_pi: 0.05
  lr_v: 0.1
  use_kl_adaptive_lr: True
  kl_target: 0.008
  kl_lr_min: 0.0001
  kl_lr_max: 0.05
  kl_lr_factor: 1.5
  is_karzmarz: False
  pi_epochs: 4
  pi_minibatches: 8
  v_epochs: 4
  v_minibatches: 8
  with_popart: True
  adv_type: gae
  clamp_ratio: True
  max_ratio: 10.0
  min_ratio: 0.1
  sigma_type: vector
  cg_damping: 0.03
  fisher_kernel: exact
  sketch_dim: 32768
  sketch_seed: 0
  sketch_diagonal_mode: z_only
  fisher_kernel_normalization: none
  fisher_kernel_normalization_eps: 1.0e-12
  grad: npg
  post_grad: l2_clip
  actor_clip_mode: l2
  max_grad_norm: 0.5
  actor_curvature_subsample: 0
  critic_curvature_subsample: 0
  actor_subsample_full_batch_gradient: False
  actor_subsample_free_rho: none
  critic_update: gn
  critic_optimizer: sgd

env_config:
  env_name: hopper
  num_envs: 32
  nsteps: 256
  timesteps_per_proc: 10_000_000
  norm_ret: False

nets_config:
  norm_obs: True
  type: transformer
  a_dropout: 0.0
  a_hidden_size: 64
  a_num_layers: 1
  c_hidden_size: 64
  c_num_layers: 1
  c_dropout: 0.0
  transformer_num_layers: 1
  transformer_num_heads: 4
  transformer_ff_multiplier: 2
  transformer_tokenization: mujoco_body
  transformer_layer_norm_eps: 1.0e-5

log_config:
  log_interval: 10
  n_eval_trials: 20
